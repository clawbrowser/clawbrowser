name: Publish portable Linux runtime

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag whose Linux x64 asset should be packaged
        required: true
        type: string
      publish:
        description: Upload to the release (disable to validate packaging only)
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: portable-linux-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish_portable_amd64:
    name: Build and publish portable Linux amd64 runtime
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      ASSET_NAME: clawbrowser-portable-linux-amd64-glibc.tar.gz
    steps:
      - name: Checkout browser release source
        uses: actions/checkout@v4

      - name: Validate portable packager
        run: |
          test -x scripts/build_portable_xvfb_from_runtime_image.sh
          bash -n scripts/build_portable_xvfb_from_runtime_image.sh

      - name: Download and verify Linux browser asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release" "${RUNNER_TEMP}/browser"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${RUNNER_TEMP}/release" \
            --pattern clawbrowser-linux-x64.tar.gz \
            --pattern clawbrowser-linux-x64.tar.gz.sha256
          (
            cd "${RUNNER_TEMP}/release"
            sha256sum -c clawbrowser-linux-x64.tar.gz.sha256
          )
          tar -xzf "${RUNNER_TEMP}/release/clawbrowser-linux-x64.tar.gz" \
            -C "${RUNNER_TEMP}/browser"

          mapfile -t binaries < <(find "${RUNNER_TEMP}/browser" -type f -name clawbrowser.real | sort)
          if [[ ${#binaries[@]} -ne 1 ]]; then
            echo "::error::expected exactly one clawbrowser.real, found ${#binaries[@]}"
            exit 1
          fi
          mkdir -p clawbrowser-dist-amd64
          cp -a "$(dirname "${binaries[0]}")/." clawbrowser-dist-amd64/
          test -x clawbrowser-dist-amd64/clawbrowser.real

      - name: Build runtime image
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --tag clawbrowser-portable-source:"${RELEASE_TAG}" \
            .

      - name: Build and verify portable archive
        run: |
          set -euo pipefail
          IMAGE_REF=clawbrowser-portable-source:"${RELEASE_TAG}" \
          VERSION="${RELEASE_TAG}" \
          OUT_DIR="${RUNNER_TEMP}/portable" \
          PLATFORM=linux/amd64 \
            ./scripts/build_portable_xvfb_from_runtime_image.sh
          (
            cd "${RUNNER_TEMP}/portable"
            sha256sum -c "${ASSET_NAME}.sha256"
            tar -tzf "${ASSET_NAME}" | grep -Fx 'linux-amd64-glibc/bin/Xvfb'
            tar -tzf "${ASSET_NAME}" | grep -Fx 'linux-amd64-glibc/bin/xkbcomp'
            tar -tzf "${ASSET_NAME}" | grep -Fx 'linux-amd64-glibc/clawbrowser/clawbrowser.real'
            tar -tzf "${ASSET_NAME}" | grep -Fx 'linux-amd64-glibc/manifest.json'
          )
          expected=$(sha256sum clawbrowser-dist-amd64/clawbrowser.real | awk '{print $1}')
          actual=$(tar -xOzf "${RUNNER_TEMP}/portable/${ASSET_NAME}" \
            linux-amd64-glibc/clawbrowser/clawbrowser.real | sha256sum | awk '{print $1}')
          test "${actual}" = "${expected}"
          python3 - "${RUNNER_TEMP}/portable/${ASSET_NAME%.tar.gz}.manifest.json" "${RELEASE_TAG}" <<'PYTHON'
          import json, sys
          with open(sys.argv[1]) as source:
              manifest = json.load(source)
          assert manifest["version"] == sys.argv[2]
          assert manifest["platform"] == "linux-amd64-glibc"
          PYTHON

      - name: Preserve validation artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.publish == false
        uses: actions/upload-artifact@v4
        with:
          name: portable-linux-validation
          path: ${{ runner.temp }}/portable/
          if-no-files-found: error
          retention-days: 7

      - name: Upload portable assets
        if: github.event_name == 'release' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            "${RUNNER_TEMP}/portable/${ASSET_NAME}" \
            "${RUNNER_TEMP}/portable/${ASSET_NAME}.sha256" \
            "${RUNNER_TEMP}/portable/${ASSET_NAME%.tar.gz}.manifest.json" \
            --clobber

      - name: Add portable archive to SHA256SUMS
        if: github.event_name == 'release' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sums_dir="${RUNNER_TEMP}/checksums"
          mkdir -p "${sums_dir}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${sums_dir}" \
            --pattern SHA256SUMS || true
          touch "${sums_dir}/SHA256SUMS"
          grep -v "  ${ASSET_NAME}$" "${sums_dir}/SHA256SUMS" \
            > "${sums_dir}/SHA256SUMS.next" || true
          cat "${RUNNER_TEMP}/portable/${ASSET_NAME}.sha256" \
            >> "${sums_dir}/SHA256SUMS.next"
          mv "${sums_dir}/SHA256SUMS.next" "${sums_dir}/SHA256SUMS"
          gh release upload "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            "${sums_dir}/SHA256SUMS" \
            --clobber
