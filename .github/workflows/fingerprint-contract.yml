name: Fingerprint contract

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capacity probe or actual no-publication Linux native builds
        type: choice
        options: [capacity, capacity-macos26, capacity-windows, build-windows, build-linux, build-macos, build-macos-arm, package-linux]
        default: capacity
      source_sha:
        description: Exact release project source to compile
        type: string
        default: 85ede59686a51e0828eadfaa6f0d137cad5efaea
      native_cpu:
        description: Linux target architecture
        type: choice
        options: [both, x64, arm64]
        default: both
      native_run_id:
        description: Completed native Linux build run to package without publication
        type: string
        default: '42031130414'
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'build-windows'
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pipeline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile pinned production native browser and tests
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: python
        run: |
          import os,pathlib,shutil,subprocess,time
          workspace=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          script=workspace/'pipeline/scripts/ci_windows_candidate.ps1'
          builder=subprocess.Popen(['pwsh','-NoProfile','-File',str(script),'-ProjectRoot',str(workspace/'source'),'-ArtifactRoot',str(workspace/'native-artifacts'),'-SourceSha',os.environ['SOURCE_SHA']])
          try:
              while builder.poll() is None:
                  if shutil.disk_usage('D:/').free<12*2**30:
                      print('::error::Stopping build to retain a 12-GiB disk reserve.',flush=True)
                      subprocess.run(['taskkill','/PID',str(builder.pid),'/T','/F'],check=False)
                      raise SystemExit(1)
                  time.sleep(20)
              raise SystemExit(builder.returncode)
          finally:
              if builder.poll() is None: subprocess.run(['taskkill','/PID',str(builder.pid),'/T','/F'],check=False)
      - name: Preserve native Windows candidates and test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-amd64-${{ inputs.source_sha }}
          path: |
            native-artifacts/*.zip
            native-artifacts/*.json
            native-artifacts/*.gn
            native-artifacts/*.txt
            native-artifacts/*.log
            native-artifacts/logs/*.log
            native-artifacts/SHA256SUMS
          compression-level: 0
          retention-days: 14

  windows-capacity:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'capacity-windows'
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Inspect Windows compiler host capacity (no build or installation)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $os=Get-CimInstance Win32_OperatingSystem
          $disks=@(Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | ForEach-Object { @{drive=$_.DeviceID;total_gib=[Math]::Round($_.Size/1GB,2);free_gib=[Math]::Round($_.FreeSpace/1GB,2)} })
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs=@(& $vswhere -all -products '*' -format json | ConvertFrom-Json | ForEach-Object { @{path=$_.installationPath;version=$_.installationVersion} })
          $data=@{cpus=$env:NUMBER_OF_PROCESSORS;memory_gib=[Math]::Round($os.TotalVisibleMemorySize/1MB,2);disks=$disks;visual_studio=$vs;chromium_checked_out=$false;build_started=$false;published=$false}
          $data | ConvertTo-Json -Depth 6 | Set-Content "$env:RUNNER_TEMP/native-windows-capacity.json"
          Get-Content "$env:RUNNER_TEMP/native-windows-capacity.json"
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-capacity
          path: ${{ runner.temp }}/native-windows-capacity.json
          retention-days: 7

  linux-runtime-package:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'package-linux'
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, cpu: x64}
          - {runner: ubuntu-24.04-arm, cpu: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: pipeline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build candidate image and portable runtime from exact native artifact
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_CPU: ${{ matrix.cpu }}
        shell: bash
        run: bash pipeline/scripts/package_native_linux_candidate.sh "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/runtime-artifacts" "$NATIVE_RUN_ID" "$SOURCE_SHA" "$TARGET_CPU"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-linux-runtime-${{ matrix.cpu }}-${{ inputs.source_sha }}
          path: runtime-artifacts/
          retention-days: 14

  runner-preflight:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'capacity' || inputs.mode == 'capacity-macos26')
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.mode == 'capacity-macos26' && '["macos-26"]' || '["ubuntu-24.04","ubuntu-24.04-arm","macos-15"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Measure clean hosted runner capacity (no Chromium checkout or build)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform, shutil, subprocess
          disk=shutil.disk_usage(os.getcwd())
          ram=int(subprocess.check_output(['sysctl','-n','hw.memsize'])) if platform.system()=='Darwin' else os.sysconf('SC_PAGE_SIZE')*os.sysconf('SC_PHYS_PAGES')
          data={'system':platform.system(),'architecture':platform.machine(),'cpus':os.cpu_count(),'memory_gib':round(ram/2**30,2),'disk_total_gib':round(disk.total/2**30,2),'disk_free_gib':round(disk.free/2**30,2),'project_documented_free_disk_gib':150,'chromium_checked_out':False,'build_started':False,'published':False}
          data['adequate_without_cleanup']=disk.free>=150*2**30 and ram>=8*2**30
          data['disk_total_below_documented_free_requirement']=disk.total<150*2**30
          if platform.system()=='Darwin':
              data['selected_xcode']=subprocess.check_output(['xcode-select','-p'],text=True).strip()
              data['installed_xcodes']=[p.name for p in pathlib.Path('/Applications').glob('Xcode*.app')]
              data['xcode_version']=subprocess.check_output(['xcodebuild','-version'],text=True).strip()
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-builder-capacity.json'
          output.write_text(json.dumps(data,indent=2)+'\n')
          print(json.dumps(data,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-builder-capacity-${{ matrix.runner }}
          path: ${{ runner.temp }}/native-builder-capacity.json
          retention-days: 7

  linux-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'build-linux'
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        cpu: ${{ fromJSON(inputs.native_cpu == 'arm64' && '["arm64"]' || inputs.native_cpu == 'x64' && '["x64"]' || '["x64","arm64"]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout CI helper
        uses: actions/checkout@v4
        with:
          path: pipeline
          persist-credentials: false
      - name: Checkout exact release project
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Compile production browser and run native tests
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_CPU: ${{ matrix.cpu }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          free_bytes=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          if (( free_bytes < 80 * 1024 * 1024 * 1024 )); then
            echo "::error::Insufficient initial disk for the space-constrained shallow native build."
            exit 1
          fi
          setsid bash pipeline/scripts/ci_native_candidate.sh "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/chromium" "$GITHUB_WORKSPACE/native-artifacts" "$SOURCE_SHA" "$TARGET_CPU" &
          builder=$!
          trap 'kill -TERM -- "-$builder" 2>/dev/null || true' EXIT
          while kill -0 "$builder" 2>/dev/null; do
            free_bytes=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
            if (( free_bytes < 12 * 1024 * 1024 * 1024 )); then
              echo "::error::Stopping this build to retain a 12-GiB disk reserve. A larger builder is required."
              kill -TERM -- "-$builder" 2>/dev/null || true
              wait "$builder" || true
              exit 1
            fi
            sleep 20
          done
          wait "$builder"
          trap - EXIT
      - name: Preserve candidate artifacts and diagnostics (never publish)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-${{ matrix.cpu }}-${{ inputs.source_sha }}
          path: |
            native-artifacts/*.tar.gz
            native-artifacts/*.json
            native-artifacts/*.log
            native-artifacts/*.gn
            native-artifacts/*.txt
            native-artifacts/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

  macos-candidate:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'build-macos' || inputs.mode == 'build-macos-arm')
    runs-on: ${{ inputs.mode == 'build-macos-arm' && 'macos-26' || 'macos-15-intel' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: pipeline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Build ad-hoc native Mac candidate (no corporate credentials)
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          /usr/bin/python3 - "$GITHUB_WORKSPACE/pipeline/scripts/ci_macos_candidate.sh" "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/chromium" "$GITHUB_WORKSPACE/native-artifacts" "$SOURCE_SHA" <<'PY'
          import os,signal,shutil,subprocess,sys,time
          builder=subprocess.Popen(['bash',*sys.argv[1:]],start_new_session=True)
          try:
              while builder.poll() is None:
                  if shutil.disk_usage(os.environ['RUNNER_TEMP']).free < 12*2**30:
                      print('::error::Stopping build to retain a 12-GiB disk reserve.',flush=True)
                      os.killpg(builder.pid,signal.SIGTERM)
                      builder.wait(timeout=30)
                      sys.exit(1)
                  time.sleep(20)
              sys.exit(builder.returncode)
          finally:
              if builder.poll() is None: os.killpg(builder.pid,signal.SIGTERM)
          PY
      - name: Preserve native Mac candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-arm64-${{ inputs.source_sha }}
          path: |
            native-artifacts/*.tar.gz
            native-artifacts/*.json
            native-artifacts/*.log
            native-artifacts/*.gn
            native-artifacts/*.txt
            native-artifacts/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

  # Numerical/staging portability only: these jobs do not certify a browser artifact.
  raster-portability:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: clang++
          - os: macos-latest
            compiler: clang++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact raster arithmetic on host compiler
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          uname -sm
          "$CXX" --version
          bash scripts/skia_fma_rounding_test.sh
          bash scripts/skia_source_over_test.sh
          bash scripts/skia_half_test.sh
          if [[ "$RUNNER_OS" == Linux ]] && grep -qw avx2 /proc/cpuinfo; then
            CLAWBROWSER_TEST_PRAGMA_AVX2=1 bash scripts/skia_source_over_test.sh
          fi

  raster-portability-windows:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify font manifest bytes and reuse checks on Windows
        run: |
          python clawbrowser/fonts/build_catalog_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python clawbrowser/fonts/windows_package_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/font_test_assets_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CLAWBROWSER_REQUIRE_7Z_TESTS = '1'
          python clawbrowser/fonts/windows_installer_payload_test.py
      - name: Reject unverified existing Windows installer reuse
        shell: pwsh
        run: ./scripts/windows_installer_mode_test.ps1
      - name: Verify exact raster arithmetic with Windows Clang and MSVC library
        shell: cmd
        env:
          CXX: clang++
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          clang++ --version
          bash scripts/skia_fma_rounding_test.sh
          if errorlevel 1 exit /b 1
          bash scripts/skia_source_over_test.sh
          if errorlevel 1 exit /b 1
          bash scripts/skia_half_test.sh

  contract:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify executable WebUI regressions
        run: |
          node scripts/verify_fonts_test.js
          node scripts/verify_screen_orientation_test.js
          node scripts/verify_timezone_alias_test.js
      - name: Verify runtime fingerprint patch contract
        run: |
          bash scripts/fingerprint_patch_contract_test.sh
          bash scripts/build_remote_prod_artifacts_test.sh
          bash scripts/build_remote_prod_artifacts_run_step_test.sh
          for patch in clawbrowser/patches/*.patch; do
            git apply --numstat "${patch}" >/dev/null
          done
      - name: Validate integration test sources
        run: |
          python3 -m py_compile \
            clawbrowser/test/integration/conftest.py \
            clawbrowser/test/integration/test_surfaces.py \
            clawbrowser/test/integration/test_privacy_migration.py \
            clawbrowser/test/integration/test_complex_font_fallback.py \
            clawbrowser/test/integration/test_system_font_policy.py \
            clawbrowser/test/integration/test_local_collection_variations.py \
            clawbrowser/test/integration/test_font_descriptor_native.py \
            clawbrowser/test/integration/test_dynamic_font_fallback.py
          python3 scripts/integration_binary_resolution_test.py
          python3 scripts/font_test_assets_test.py
          python3 scripts/compare_canvas_observations_test.py
          python3 -m json.tool \
            clawbrowser/test/fixtures/valid_fingerprint.json >/dev/null
      - name: Verify exact baseline raster arithmetic
        run: |
          bash scripts/skia_fma_rounding_test.sh
          bash scripts/skia_source_over_test.sh
          bash scripts/skia_half_test.sh
      - name: Verify font catalog staging integrity
        run: |
          python3 clawbrowser/fonts/stage_fonts_test.py
          python3 clawbrowser/fonts/build_catalog_test.py
          python3 clawbrowser/fonts/windows_package_test.py
          python3 scripts/linux_runtime_fonts_test.py
      - name: Run network control unit regressions (no browser or secrets)
        run: |
          python3 -m pip install -r clawbrowser/test/integration/requirements.txt
          python3 -m compileall -q clawbrowser/test/integration
          python3 -m pytest clawbrowser/test/integration/test_stun_control.py -q
