name: Fingerprint contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify runtime fingerprint patch contract
        run: bash scripts/fingerprint_patch_contract_test.sh
      - name: Validate integration test sources
        run: |
          python3 -m py_compile \
            clawbrowser/test/integration/conftest.py \
            clawbrowser/test/integration/test_surfaces.py
          python3 -m json.tool \
            clawbrowser/test/fixtures/valid_fingerprint.json >/dev/null
